spring.application.name=rotavital

spring.datasource.url=jdbc:h2:mem:rotavital;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O schema é versionado pelo Flyway (src/main/resources/db/migration).
# O Hibernate só confere se as entidades batem com as tabelas.
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Bancos criados antes do Flyway (pelo antigo ddl-auto=update) já têm o schema da V1:
# o Flyway marca a V1 como baseline e aplica só as migrations seguintes.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Alocação (história 2): a bolsa só é alocada se faltarem pelo menos N dias para vencer.
rotavital.alocacao.validade-minima-dias=1

# Painel de indicadores (história 7).
# Período usado quando o filtro não informa datas.
rotavital.indicadores.periodo-padrao-dias=30
# Abaixo desta quantidade de bolsas disponíveis o componente aparece como estoque crítico.
rotavital.indicadores.nivel-critico=5
# Horizonte, em dias, da probabilidade de desabastecimento.
rotavital.indicadores.horizonte-dias=7

# Rotas (história 3): tempo máximo de transporte da cadeia fria e limite de hospitais por rota.
rotavital.rotas.janela-padrao-minutos=120
rotavital.rotas.maximo-destinos=8

# Cadeia fria (história 6): sem leitura por mais que este tempo, o sensor é dado como indisponível.
rotavital.remessas.intervalo-maximo-minutos=10
rotavital.remessas.verificacao-ms=60000

# ===================================================================
# Observabilidade (entrega E1 — Actuator + Prometheus)
# ===================================================================

# Quais endpoints do Actuator ficam acessíveis por HTTP.
# Por padrão o Actuator só publica 'health'. Os outros existem, mas respondem 404
# até serem listados aqui. É uma lista de permissão: nada entra sem ser nomeado.
# Deliberadamente NÃO incluímos 'env' nem 'loggers' (exporiam a senha do banco).
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Faz /actuator/health detalhar cada verificação (banco, disco) em vez de só "UP".
# Útil para diagnóstico e para o healthcheck do Docker.
management.endpoint.health.show-details=always

# Adiciona a label application="rotavital" em TODAS as métricas exportadas.
# É o que permite ao Grafana separar as métricas por aplicação (requisito R1.4).
# O ${...} reaproveita o spring.application.name da linha 1: um só lugar para mudar.
management.metrics.tags.application=${spring.application.name}

# Faz o Micrometer calcular histogramas das requisições HTTP.
# Sem isto existe só a média, e média esconde picos. Com isto o Prometheus recebe
# buckets e o Grafana consegue calcular p95/p99 (latência que 95%/99% experimentam).
# Nota: 'http.server.requests' é o NOME da métrica e já contém pontos — por isso
# a chave fica longa; os pontos da propriedade e os do nome se encostam.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Histograma também para o timer de negócio do cálculo de rota, permitindo p95
# da operação crítica (algoritmo de Dijkstra sobre o grafo da rede).
management.metrics.distribution.percentiles-histogram.rotavital.rotas.calculo=true

# Registra os MBeans do Tomcat. Sem isto as métricas tomcat_threads_* não existem
# e os painéis de saturação do pool HTTP ficam vazios (o Spring desliga por padrão
# porque o registro de MBeans tem custo no boot).
server.tomcat.mbeanregistry.enabled=true

# Intervalo de releitura das métricas de negócio. Acompanha o scrape_interval do
# Prometheus (15s): atualizar mais rápido gastaria banco sem o Prometheus perceber.
rotavital.metricas.intervalo-ms=15000

# Habilita /api/diagnostico/*, que gera falhas 5xx controladas para dar dados ao
# painel de taxa de erro de servidor. Remover esta linha desativa os endpoints.
rotavital.diagnostico.habilitado=true

# ===================================================================
# Tracing distribuido (entrega E6 - traces no Tempo)
# ===================================================================

# Fracao de requisicoes que geram trace. O padrao do Spring Boot e 0.1 (10%),
# para nao sobrecarregar o backend de traces em producao. Aqui usamos 100%
# porque o volume e pequeno e a avaliacao exige evidencia de traces.
management.tracing.sampling.probability=1.0

# O endereco do Tempo NAO fica aqui: vem da variavel de ambiente
# MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT definida no compose.yaml,
# porque muda conforme o ambiente.

# Inclui traceId e spanId no padrão de log. Com Micrometer Tracing no classpath o
# Spring Boot ja faz isso por padrão; a linha abaixo torna o formato explicito e
# e o que permite ao Alloy extrair o traceId por expressao regular e ao Grafana
# saltar do log para o trace (requisito R6.3).
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}] 
logging.include-application-name=false

# Granularidade dos spans de JDBC (biblioteca datasource-micrometer).
# Por padrao observa CONNECTION, QUERY, KEYS e FETCH. O FETCH cria um span por
# interacao com o ResultSet: numa consulta com problema N+1 isso gerou 973 spans
# em UMA requisicao a /api/bolsas, inflando o Tempo sem acrescentar diagnostico.
# ATENCAO: os valores sao o enum em MAIUSCULAS; em minusculas a propriedade e
# silenciosamente ignorada (foi o que aconteceu na primeira tentativa).
jdbc.includes=CONNECTION,QUERY
# Desliga o rastreio de operacoes no ResultSet (span 'result-set').
jdbc.resultset-operations.enabled=false
# Grava a consulta SQL como atributo do span, para saber QUAL query foi lenta.
jdbc.datasource-proxy.include-parameter-values=false
