spring.application.name=rotavital

spring.datasource.url=jdbc:h2:mem:rotavital;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O schema é versionado pelo Flyway (src/main/resources/db/migration).
# O Hibernate só confere se as entidades batem com as tabelas.
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Bancos criados antes do Flyway (pelo antigo ddl-auto=update) já têm o schema da V1:
# o Flyway marca a V1 como baseline e aplica só as migrations seguintes.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Alocação (história 2): a bolsa só é alocada se faltarem pelo menos N dias para vencer.
rotavital.alocacao.validade-minima-dias=1

# Painel de indicadores (história 7).
# Período usado quando o filtro não informa datas.
rotavital.indicadores.periodo-padrao-dias=30
# Abaixo desta quantidade de bolsas disponíveis o componente aparece como estoque crítico.
rotavital.indicadores.nivel-critico=5
# Horizonte, em dias, da probabilidade de desabastecimento.
rotavital.indicadores.horizonte-dias=7

# Rotas (história 3): tempo máximo de transporte da cadeia fria e limite de hospitais por rota.
rotavital.rotas.janela-padrao-minutos=120
rotavital.rotas.maximo-destinos=8

# Cadeia fria (história 6): sem leitura por mais que este tempo, o sensor é dado como indisponível.
rotavital.remessas.intervalo-maximo-minutos=10
rotavital.remessas.verificacao-ms=60000
