# ============================================================================
# Grafana — provisionamento de datasources
#
# "Provisionar" = configurar por arquivo, sem ninguém clicar na interface.
# Exigido pelo requisito R4.3 e necessário para o R4.1 (subir sem passo manual).
#
# Os endereços usam o DNS interno do Docker (nome do serviço no compose).
# ============================================================================

apiVersion: 1

# Remove versões anteriores antes de recriar. Sem isto, mudar o 'uid' de um
# datasource já provisionado quebra o boot do Grafana com
# "Datasource provisioning error: data source not found", porque o registro
# antigo continua no banco interno (volume grafana_data).
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus            # uid FIXO: os JSONs dos dashboards referenciam
                               # esta string. Sem fixar, o Grafana sorteia um uid
                               # e os painéis quebram ao subir em outra máquina.
    access: proxy              # o Grafana (servidor) consulta, não o navegador
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # Deve ser >= scrape_interval do prometheus.yml, senão os gráficos
      # mostram degraus em vez de linha contínua.
      timeInterval: 15s
    editable: false            # evita alguém alterar pela UI e divergir do Git
